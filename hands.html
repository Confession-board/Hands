<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Purple Hand Portal</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; font-family: monospace; }
        #container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        /* Camera Flash Overlay */
        #flash-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 200;
            transition: opacity 0.2s ease-out;
        }

        /* Tap to Start Overlay */
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; color: #fff; text-align: center;
            padding: 20px;
        }
        #start-btn {
            padding: 16px 32px; font-size: 18px; font-weight: bold; background: #ff00ff;
            color: #fff; border: none; border-radius: 30px; box-shadow: 0 0 15px #ff00ff;
            cursor: pointer; margin-top: 20px; font-family: monospace;
        }
        
        /* Top Status Bar */
        #ui-bar {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10; pointer-events: none;
        }
        #status-container { display: flex; flex-direction: column; gap: 4px; }
        #status {
            color: #ff00ff; font-size: 13px; text-shadow: 0 0 8px #ff00ff;
            background: rgba(0, 0, 0, 0.7); padding: 8px 12px; border-radius: 8px;
        }
        #voice-status {
            color: #00ffff; font-size: 11px; text-shadow: 0 0 6px #00ffff;
            background: rgba(0, 0, 0, 0.7); padding: 4px 8px; border-radius: 6px; width: fit-content;
        }

        /* Bottom Control Buttons (Backup for Mobile) */
        #controls-bar {
            position: absolute; bottom: 20px; display: flex; gap: 15px; z-index: 10;
        }
        .action-btn {
            padding: 12px 20px; font-size: 14px; font-weight: bold; font-family: monospace;
            background: rgba(0, 0, 0, 0.75); color: #fff; border: 2px solid #ff00ff;
            border-radius: 25px; cursor: pointer; backdrop-filter: blur(4px);
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }
        .action-btn:active { transform: scale(0.95); background: #ff00ff; }

        /* Color Picker Buttons */
        .color-picker {
            display: flex; gap: 8px; pointer-events: auto;
            background: rgba(0, 0, 0, 0.7); padding: 6px 10px; border-radius: 20px;
        }
        .color-btn {
            width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff;
            cursor: pointer; transition: transform 0.2s;
        }
        .color-btn:active { transform: scale(1.2); }
    </style>
</head>
<body>
    <div id="container">
        <div id="flash-overlay"></div>

        <div id="ui-bar">
            <div id="status-container">
                <div id="status">🟣 READY - BRING 2 HANDS</div>
                <div id="voice-status">🗣️ VOICE OR TAP CONTROLS READY</div>
            </div>
            <div class="color-picker">
                <div class="color-btn" style="background: #ff00ff;" onclick="setTheme('neon')"></div>
                <div class="color-btn" style="background: #8a2be2;" onclick="setTheme('deep')"></div>
                <div class="color-btn" style="background: #e0b0ff;" onclick="setTheme('lavender')"></div>
                <div class="color-btn" style="background: #4b0082;" onclick="setTheme('indigo')"></div>
            </div>
        </div>

        <!-- On-Screen Controls for instant tap fallback -->
        <div id="controls-bar">
            <button class="action-btn" onclick="takeSnapshot()">📸 SHOT</button>
            <button class="action-btn" onclick="cycleTheme()">🎨 CHANGE COLOR</button>
        </div>

        <div id="start-overlay">
            <h2>Hand Portal</h2>
            <p>Touch fingers together to open the portal.<br>Say <b>"SHOT"</b> / <b>"CHANGE"</b> or use the screen buttons.</p>
            <button id="start-btn">ALLOW CAMERA & MIC</button>
        </div>

        <video id="webcam" playsinline autoplay muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startOverlay = document.getElementById('start-overlay');
        const startBtn = document.getElementById('start-btn');
        const statusElem = document.getElementById('status');
        const voiceStatusElem = document.getElementById('voice-status');
        const flashOverlay = document.getElementById('flash-overlay');

        // Purple Variants
        const themeKeys = ['neon', 'deep', 'lavender', 'indigo'];
        let currentThemeIdx = 0;

        const themes = {
            neon:     { stroke: 'rgba(255, 0, 255, 0.9)',   fill: 'rgba(255, 0, 255, 0.35)',  glow: '#ff00ff', name: 'ELECTRIC NEON' },
            deep:     { stroke: 'rgba(138, 43, 226, 0.9)',  fill: 'rgba(138, 43, 226, 0.35)', glow: '#8a2be2', name: 'DEEP CYBER' },
            lavender: { stroke: 'rgba(224, 176, 255, 0.9)', fill: 'rgba(224, 176, 255, 0.35)', glow: '#e0b0ff', name: 'SOFT LAVENDER' },
            indigo:   { stroke: 'rgba(75, 0, 130, 0.9)',    fill: 'rgba(75, 0, 130, 0.45)',   glow: '#4b0082', name: 'COSMIC INDIGO' }
        };
        let currentTheme = themes.neon;

        function setTheme(key) {
            currentTheme = themes[key];
            currentThemeIdx = themeKeys.indexOf(key);
            statusElem.style.color = currentTheme.glow;
            statusElem.style.textShadow = `0 0 8px ${currentTheme.glow}`;
        }

        function cycleTheme() {
            currentThemeIdx = (currentThemeIdx + 1) % themeKeys.length;
            setTheme(themeKeys[currentThemeIdx]);
            voiceStatusElem.innerText = `🎨 COLOR: ${currentTheme.name}`;
            setTimeout(() => {
                voiceStatusElem.innerText = '🗣️ VOICE OR TAP CONTROLS READY';
            }, 2500);
        }

        function takeSnapshot() {
            flashOverlay.style.opacity = '1';
            setTimeout(() => { flashOverlay.style.opacity = '0'; }, 200);

            voiceStatusElem.innerText = "📸 SNAPSHOT CAPTURED!";

            const image = canvasElement.toDataURL("image/png");
            const link = document.createElement('a');
            link.download = `hand-portal-${Date.now()}.png`;
            link.href = image;
            link.click();

            setTimeout(() => {
                voiceStatusElem.innerText = '🗣️ VOICE OR TAP CONTROLS READY';
            }, 2500);
        }

        // Voice Recognition Initialization
        function initVoiceCommands() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                voiceStatusElem.innerText = "👉 USE ON-SCREEN BUTTONS BELOW";
                return;
            }

            try {
                const recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                recognition.onresult = (event) => {
                    const lastIdx = event.results.length - 1;
                    const command = event.results[lastIdx][0].transcript.trim().toLowerCase();

                    if (command.includes('shot') || command.includes('shoot') || command.includes('snap')) {
                        takeSnapshot();
                    } else if (command.includes('change') || command.includes('switch') || command.includes('color')) {
                        cycleTheme();
                    }
                };

                recognition.onerror = () => {
                    voiceStatusElem.innerText = "👉 USE ON-SCREEN BUTTONS BELOW";
                };

                recognition.onend = () => {
                    try { recognition.start(); } catch(e) {}
                };

                recognition.start();
            } catch(e) {
                voiceStatusElem.innerText = "👉 USE ON-SCREEN BUTTONS BELOW";
            }
        }

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 0,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawLandmarks(canvasCtx, landmarks, {color: '#FFFFFF', lineWidth: 1, radius: 2});
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#FFFFFF', lineWidth: 1});
                }

                if (results.multiHandLandmarks.length === 2) {
                    const hand1 = results.multiHandLandmarks[0];
                    const hand2 = results.multiHandLandmarks[1];
                    const w = canvasElement.width;
                    const h = canvasElement.height;

                    const h1_idx = { x: hand1[8].x, y: hand1[8].y };
                    const h1_thb = { x: hand1[4].x, y: hand1[4].y };
                    const h2_idx = { x: hand2[8].x, y: hand2[8].y };
                    const h2_thb = { x: hand2[4].x, y: hand2[4].y };

                    // Exact finger contact checks (Index-to-Index, Thumb-to-Thumb, or Index-to-Thumb)
                    const indexContact = Math.hypot(h1_idx.x - h2_idx.x, h1_idx.y - h2_idx.y);
                    const thumbContact = Math.hypot(h1_thb.x - h2_thb.x, h1_thb.y - h2_thb.y);
                    const crossContact1 = Math.hypot(h1_idx.x - h2_thb.x, h1_idx.y - h2_thb.y);
                    const crossContact2 = Math.hypot(h1_thb.x - h2_idx.x, h1_thb.y - h2_idx.y);

                    // Touch threshold requirement
                    const TOUCH_THRESHOLD = 0.12; 
                    const isTouching = indexContact < TOUCH_THRESHOLD || 
                                       thumbContact < TOUCH_THRESHOLD || 
                                       crossContact1 < TOUCH_THRESHOLD || 
                                       crossContact2 < TOUCH_THRESHOLD;

                    if (isTouching) {
                        statusElem.innerText = `🟣 PORTAL ACTIVE (${currentTheme.name})`;

                        const p1 = { x: h1_idx.x * w, y: h1_idx.y * h };
                        const p2 = { x: h2_idx.x * w, y: h2_idx.y * h };
                        const p3 = { x: h2_thb.x * w, y: h2_thb.y * h };
                        const p4 = { x: h1_thb.x * w, y: h1_thb.y * h };

                        canvasCtx.beginPath();
                        canvasCtx.moveTo(p1.x, p1.y);
                        canvasCtx.lineTo(p2.x, p2.y);
                        canvasCtx.lineTo(p3.x, p3.y);
                        canvasCtx.lineTo(p4.x, p4.y);
                        canvasCtx.closePath();

                        canvasCtx.fillStyle = currentTheme.fill;
                        canvasCtx.fill();

                        canvasCtx.strokeStyle = currentTheme.stroke;
                        canvasCtx.lineWidth = 6;
                        canvasCtx.stroke();

                        canvasCtx.strokeStyle = '#FFFFFF';
                        canvasCtx.lineWidth = 2;
                        canvasCtx.stroke();
                    } else {
                        statusElem.innerText = "👉 TOUCH FINGER TIPS TO CONNECT";
                    }
                } else {
                    statusElem.innerText = "🟣 WAITING FOR 2 HANDS";
                }
            }
            canvasCtx.restore();
        });

        async function processVideo() {
            if (!videoElement.paused && !videoElement.ended) {
                await hands.send({ image: videoElement });
            }
            requestAnimationFrame(processVideo);
        }

        startBtn.addEventListener('click', async () => {
            try {
                // Request both video and audio streams
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: true
                });
                videoElement.srcObject = stream;
                await videoElement.play();
                startOverlay.style.display = 'none';
                
                initVoiceCommands();
                processVideo();
            } catch (err) {
                // Fallback to video only if mic permissions are blocked by the OS
                try {
                    const videoOnlyStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false
                    });
                    videoElement.srcObject = videoOnlyStream;
                    await videoElement.play();
                    startOverlay.style.display = 'none';
                    processVideo();
                } catch(videoErr) {
                    alert('Camera access error: ' + videoErr.message);
                }
            }
        });
    </script>
</body>
</html>

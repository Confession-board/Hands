<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Purple Connected Hands Portal</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0; padding: 0; background-color: #000;
            display: flex; justify-content: center; align-items: center;
            width: 100vw; height: 100vh; overflow: hidden; font-family: monospace;
        }
        
        .input_video { display: none; }
        
        .output_canvas {
            width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); 
        }

        .portal-header {
            position: absolute; top: 15px; left: 20px; color: #b400ff;
            font-size: 18px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); z-index: 10;
        }
    </style>
</head>
<body>

    <div class="portal-header">🟣 PURPLE PORTAL ACTIVE</div>

    <video class="input_video" playsinline autoplay muted></video>
    <canvas class="output_canvas" width="1280" height="720"></canvas>

    <script>
        const videoElement = document.querySelector('.input_video');
        const canvasElement = document.querySelector('.output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            
            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawLandmarks(canvasCtx, landmarks, {color: '#FFFFFF', lineWidth: 1, radius: 2});
                }

                // Portal connection activates ONLY when exactly 2 hands are detected
                if (results.multiHandLandmarks.length === 2) {
                    const hand1 = results.multiHandLandmarks[0];
                    const hand2 = results.multiHandLandmarks[1];
                    const w = canvasElement.width, h = canvasElement.height;

                    const h1_index = { x: hand1[8].x * w, y: hand1[8].y * h };
                    const h1_thumb = { x: hand1[4].x * w, y: hand1[4].y * h };
                    const h2_index = { x: hand2[8].x * w, y: hand2[8].y * h };
                    const h2_thumb = { x: hand2[4].x * w, y: hand2[4].y * h };

                    // Add a neon glow effect
                    canvasCtx.shadowColor = '#b400ff';
                    canvasCtx.shadowBlur = 15;

                    // Draw the portal shape
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(h1_index.x, h1_index.y);
                    canvasCtx.lineTo(h2_index.x, h2_index.y);
                    canvasCtx.lineTo(h2_thumb.x, h2_thumb.y);
                    canvasCtx.lineTo(h1_thumb.x, h1_thumb.y);
                    canvasCtx.closePath();

                    // Solid purple borders
                    canvasCtx.strokeStyle = 'rgba(180, 0, 255, 0.9)';
                    canvasCtx.lineWidth = 3;
                    canvasCtx.stroke();
                    
                    // Transparent purple fill inside
                    canvasCtx.fillStyle = 'rgba(180, 0, 255, 0.3)';
                    canvasCtx.fill();
                    
                    // Reset shadow so it doesn't affect other drawings next frame
                    canvasCtx.shadowBlur = 0;
                }
            }
            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 2, 
            modelComplexity: 1,
            minDetectionConfidence: 0.5, 
            minTrackingConfidence: 0.5
        });
        
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 1280, height: 720
        });
        
        camera.start();
    </script>
</body>
</html>

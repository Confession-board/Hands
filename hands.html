<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Purple Portal</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; font-family: monospace; }
        #container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        /* Tap to start screen */
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; color: #fff; text-align: center;
        }
        #start-btn {
            padding: 16px 32px; font-size: 18px; font-weight: bold; background: #ff00ff;
            color: #fff; border: none; border-radius: 30px; box-shadow: 0 0 15px #ff00ff;
            cursor: pointer; margin-top: 15px; font-family: monospace;
        }
        
        /* UI Status & Color Controls */
        #ui-bar {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10; pointer-events: none;
        }
        #status {
            color: #ff00ff; font-size: 14px; text-shadow: 0 0 8px #ff00ff;
            background: rgba(0, 0, 0, 0.6); padding: 8px 12px; border-radius: 8px;
        }
        .color-picker {
            display: flex; gap: 8px; pointer-events: auto;
            background: rgba(0, 0, 0, 0.6); padding: 6px 10px; border-radius: 20px;
        }
        .color-btn {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff;
            cursor: pointer; transition: transform 0.2s;
        }
        .color-btn:active { transform: scale(1.2); }
    </style>
</head>
<body>
    <div id="container">
        <div id="ui-bar">
            <div id="status">🟣 READY - BRING 2 HANDS</div>
            <div class="color-picker">
                <div class="color-btn" style="background: #ff00ff;" onclick="setTheme('neon')"></div>
                <div class="color-btn" style="background: #8a2be2;" onclick="setTheme('deep')"></div>
                <div class="color-btn" style="background: #e0b0ff;" onclick="setTheme('lavender')"></div>
                <div class="color-btn" style="background: #4b0082;" onclick="setTheme('indigo')"></div>
            </div>
        </div>

        <div id="start-overlay">
            <h2>Hand Portal</h2>
            <p>Tap below & touch fingers to open portal</p>
            <button id="start-btn">ENABLE CAMERA</button>
        </div>

        <video id="webcam" playsinline autoplay muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startOverlay = document.getElementById('start-overlay');
        const startBtn = document.getElementById('start-btn');
        const statusElem = document.getElementById('status');

        // Color Themes (Stroke, Fill, Label Glow)
        const themes = {
            neon:     { stroke: 'rgba(255, 0, 255, 0.9)',   fill: 'rgba(255, 0, 255, 0.35)',  glow: '#ff00ff', name: 'ELECTRIC NEON' },
            deep:     { stroke: 'rgba(138, 43, 226, 0.9)',  fill: 'rgba(138, 43, 226, 0.35)', glow: '#8a2be2', name: 'DEEP CYBER' },
            lavender: { stroke: 'rgba(224, 176, 255, 0.9)', fill: 'rgba(224, 176, 255, 0.35)', glow: '#e0b0ff', name: 'SOFT LAVENDER' },
            indigo:   { stroke: 'rgba(75, 0, 130, 0.9)',    fill: 'rgba(75, 0, 130, 0.45)',   glow: '#4b0082', name: 'COSMIC INDIGO' }
        };
        let currentTheme = themes.neon;

        function setTheme(key) {
            currentTheme = themes[key];
            statusElem.style.color = currentTheme.glow;
            statusElem.style.textShadow = `0 0 8px ${currentTheme.glow}`;
        }

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Optimized MediaPipe Configuration for Zero Lag
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 0, // 0 = Lite (High FPS on mobile)
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks) {
                // Draw basic landmarks
                for (const landmarks of results.multiHandLandmarks) {
                    drawLandmarks(canvasCtx, landmarks, {color: '#FFFFFF', lineWidth: 1, radius: 2});
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#FFFFFF', lineWidth: 1});
                }

                if (results.multiHandLandmarks.length === 2) {
                    const hand1 = results.multiHandLandmarks[0];
                    const hand2 = results.multiHandLandmarks[1];
                    const w = canvasElement.width;
                    const h = canvasElement.height;

                    // Landmarks: 8 = Index tip, 4 = Thumb tip (Normalized 0.0 - 1.0)
                    const h1_idx = { x: hand1[8].x, y: hand1[8].y };
                    const h1_thb = { x: hand1[4].x, y: hand1[4].y };
                    const h2_idx = { x: hand2[8].x, y: hand2[8].y };
                    const h2_thb = { x: hand2[4].x, y: hand2[4].y };

                    // Proximity / Contact Check (Euclidean distance in normalized space)
                    const indexDist = Math.hypot(h1_idx.x - h2_idx.x, h1_idx.y - h2_idx.y);
                    const thumbDist = Math.hypot(h1_thb.x - h2_thb.x, h1_thb.y - h2_thb.y);
                    const crossDist1 = Math.hypot(h1_idx.x - h2_thb.x, h1_idx.y - h2_thb.y);
                    const crossDist2 = Math.hypot(h1_thb.x - h2_idx.x, h1_thb.y - h2_idx.y);

                    // Threshold: triggers when fingers come close (< 0.18 normalized distance)
                    const CONTACT_THRESHOLD = 0.18;
                    const isContactMade = indexDist < CONTACT_THRESHOLD || 
                                          thumbDist < CONTACT_THRESHOLD || 
                                          crossDist1 < CONTACT_THRESHOLD || 
                                          crossDist2 < CONTACT_THRESHOLD;

                    if (isContactMade) {
                        statusElem.innerText = `🟣 PORTAL OPEN (${currentTheme.name})`;

                        // Convert to screen pixel coordinates
                        const p1 = { x: h1_idx.x * w, y: h1_idx.y * h };
                        const p2 = { x: h2_idx.x * w, y: h2_idx.y * h };
                        const p3 = { x: h2_thb.x * w, y: h2_thb.y * h };
                        const p4 = { x: h1_thb.x * w, y: h1_thb.y * h };

                        canvasCtx.beginPath();
                        canvasCtx.moveTo(p1.x, p1.y);
                        canvasCtx.lineTo(p2.x, p2.y);
                        canvasCtx.lineTo(p3.x, p3.y);
                        canvasCtx.lineTo(p4.x, p4.y);
                        canvasCtx.closePath();

                        // Inner Fill
                        canvasCtx.fillStyle = currentTheme.fill;
                        canvasCtx.fill();

                        // Fast Outer Glow Outline
                        canvasCtx.strokeStyle = currentTheme.stroke;
                        canvasCtx.lineWidth = 6;
                        canvasCtx.stroke();

                        // Inner Core White Line
                        canvasCtx.strokeStyle = '#FFFFFF';
                        canvasCtx.lineWidth = 2;
                        canvasCtx.stroke();
                    } else {
                        statusElem.innerText = "👉 TOUCH FINGERS TO CONNECT";
                    }
                } else {
                    statusElem.innerText = "🟣 WAITING FOR 2 HANDS";
                }
            }
            canvasCtx.restore();
        });

        // Frame rendering loop
        async function processVideo() {
            if (!videoElement.paused && !videoElement.ended) {
                await hands.send({ image: videoElement });
            }
            requestAnimationFrame(processVideo);
        }

        // Camera Initialization (640x480 resolution for smooth performance)
        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                });
                videoElement.srcObject = stream;
                await videoElement.play();
                startOverlay.style.display = 'none';
                processVideo();
            } catch (err) {
                alert('Camera access failed. Make sure to allow camera permissions: ' + err.message);
            }
        });
    </script>
</body>
</html>
